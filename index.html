<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun Derin!</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            overflow: hidden; /* Prevent scrollbars from confetti */
        }

        .title-font {
            font-family: 'Dancing Script', cursive;
        }

        /* Animations */
        .animate-pop-in {
            opacity: 0;
            animation: popIn 1.5s cubic-bezier(0.25, 1, 0.5, 1) 0.5s forwards;
        }

        .animate-fade-up {
            opacity: 0;
            animation: fadeUp 1.5s ease-out 1.5s forwards;
        }
        
        .animate-pulse-slow {
            animation: pulseSlow 3s infinite alternate 2.5s;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeUp {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes pulseSlow {
            0% { transform: scale(1); text-shadow: 0 0 10px rgba(255,255,255,0.5); }
            100% { transform: scale(1.02); text-shadow: 0 0 25px rgba(255,255,255,0.9); }
        }

        .text-glow {
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.15);
        }
        
        /* Glassmorphism card effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative w-full h-full p-4 sm:p-8">

    <!-- Main Content Container -->
    <div class="glass-card max-w-4xl w-full p-8 sm:p-12 md:p-16 text-center z-10 animate-pulse-slow">
        
        <!-- Primary Greeting -->
        <h1 class="title-font animate-pop-in text-5xl sm:text-7xl md:text-8xl text-pink-600 mb-6 drop-shadow-lg font-bold">
            Doğum Günün Kutlu Olsun <br/>
            <span class="text-purple-600">Derin</span>
        </h1>
        
        <!-- Secondary Message -->
        <p class="animate-fade-up text-xl sm:text-3xl md:text-4xl text-gray-800 font-semibold mt-8 text-glow leading-relaxed">
            İyi ki doğdun Derin, <br/>
            <span class="text-pink-500 font-bold">senle nice yıllara! 🎂🎉</span>
        </p>

        <!-- Optional: Replay Button -->
        <button onclick="triggerConfetti()" class="animate-fade-up mt-12 bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-300 active:scale-95">
            Daha Fazla Konfeti! 🥳
        </button>
    </div>

    <!-- JavaScript for Confetti and Logic -->
    <script>
        // Function to shoot confetti from both sides
        function triggerConfetti() {
            const duration = 5 * 1000; // 5 seconds duration
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
            
            // Custom vibrant colors
            const colors = ['#ff69b4', '#9370db', '#00ffff', '#ffd700', '#ff1493'];

            function frame() {
                // Shoot from left edge
                confetti({
                    particleCount: 6,
                    angle: 60,
                    spread: 60,
                    origin: { x: 0, y: 0.6 },
                    colors: colors
                });
                
                // Shoot from right edge
                confetti({
                    particleCount: 6,
                    angle: 120,
                    spread: 60,
                    origin: { x: 1, y: 0.6 },
                    colors: colors
                });

                if (Date.now() < animationEnd) {
                    requestAnimationFrame(frame);
                }
            }
            
            // Start the frame loop
            frame();
        }

        // Trigger the confetti automatically when the page loads
        window.onload = function() {
            // Small delay to match the text pop-in animation
            setTimeout(triggerConfetti, 500);
        };
    </script>
</body>
</html>
